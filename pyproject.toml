[project]
name = "cloudstaff-dev"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "lifelines>=0.30.0",
    "matplotlib>=3.11.2",
    "numpy>=2.5.3",
    "openpyxl>=3.1.5",
    "pandas>=3.0.6",
    "scikit-learn>=1.9.1",
    # news scraper (Marketing Intelligence/news_scraper)
    "requests>=2.32",
    "beautifulsoup4>=4.12",
]

[project.scripts]
cloudstaff-dev = "cloudstaff_dev:main"

[build-system]
requires = ["uv_build>=0.12.23,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ipykernel>=7.4.0",
    "jupyterlab>=4.6.4",
]
# client_growth_project: extra modelling, statistics and Excel automation packages
client-growth = [
    "statsmodels",
    "lightgbm",
    "xgboost",
    "shap",
    "xlwings",
    "pywin32; sys_platform == 'win32'",
]

[tool.uv]
# A plain `uv sync` installs every group, so no project's packages get removed
default-groups = ["dev", "client-growth"]
